  # ═══════════════════════════════════════════════════════

  - type: pipeline
    name: slideshow-playback-di-implement
    tasks:
      - type: agent
        name: slideshow-playback-di-implementer
        task: |
          Wire DI containers for the slideshow-playback feature.
          Reference: plans/slideshow-playback/di.md

          Modified files:
          - Sources/DI/InfrastructureContainer.swift
            Add properties:
              let slideshowDataSource: any SlideshowDataSourceProtocol
              let configDataSource: any ConfigDataSourceProtocol
            In init: wire SlideshowDataSource(container: modelContainer) and ConfigStore(fileURL: configURL)
            configURL = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0]
              .appendingPathComponent("10slide", isDirectory: true)
              .appendingPathComponent("config.yml")

          - Sources/DI/RepositoryContainer.swift
            Add properties:
              let slideshowRepository: any SlideshowRepositoryProtocol
              let configRepository: any ConfigRepositoryProtocol
              let imageRepository: any ImageRepositoryProtocol
            In init: wire SlideshowRepository, ConfigRepository, ImageRepository with infrastructure data sources.

          - Sources/DI/UseCaseContainer.swift
            Add properties for all 6 use cases:
              let createSlideshow: CreateSlideshowUseCase
              let fetchSlideshow: FetchSlideshowUseCase
              let fetchLibrary: FetchLibraryUseCase
              let loadSlideImage: LoadSlideImageUseCase
              let loadConfig: LoadConfigUseCase
              let saveConfig: SaveConfigUseCase
            Wire each from repositories container.

          - Sources/DI/PresentationContainer.swift
            Add @MainActor factory methods:
              func makeLibraryPickerViewModel() -> LibraryPickerViewModel
              func makeSlideshowPlayerViewModel(slideshow: Slideshow) -> SlideshowPlayerViewModel

          After editing verify with:
          xcodebuild -scheme 10slide -destination 'platform=macOS' build
        model: sonnet
        allowed_tools:
          - Read
          - Write
          - Edit
          - Bash

      - type: agent
        name: slideshow-playback-di-reviewer
        task: |
          target_path: Sources/DI/
          ng_output_path: .claude/tmp/slideshow-playback-di-reviewer

          Review: InfrastructureContainer.swift, RepositoryContainer.swift, UseCaseContainer.swift,
          PresentationContainer.swift (all modified).
        skill: review-arch
        model: sonnet
        allowed_tools:
          - Read
          - Bash
        rejected:
          to: slideshow-playback-di-implementer
          max_retries: 3

      - type: script
        command: xcodebuild -scheme 10slide -destination 'platform=macOS' build
        rejected:
          to: slideshow-playback-di-implementer
          max_retries: 3

  - type: agent
    name: slideshow-playback-di-implementer
    task: |
      DI containers wired and build passes. Commit with message: feat(di): wire slideshow-playback dependencies across all containers
    model: haiku
    allowed_tools:
      - Read
      - Bash
