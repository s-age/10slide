      ## このファイルで解説すべき概念


      - `struct ... : View` — View プロトコル

      - `let` vs `var` — プロパティの宣言

      - `@escaping` クロージャ — ライフサイクルを超えるクロージャ

      - `var body: some View` — body プロパティと some キーワード

      - `ZStack`, `HStack` — レイアウトコンテナ

      - `.ignoresSafeArea()` — セーフエリア

      - `.frame()`, `.padding()` — レイアウト修飾子

      - `if let` — Optional バインディング

      - `.task { }` — 非同期タスク修飾子（onAppear との違い）

      - `.onKeyPress()` — キーボードイベント

      - `.onTapGesture`, `.simultaneousGesture`, `DragGesture` — ジェスチャー

      - `.animation()` — アニメーション

      - `.transition()` — トランジション

      - `@ViewBuilder` — ビュービルダー属性

      - `AnyTransition` — 型消去されたトランジション

      - `.onReceive(NotificationCenter...)` — 通知の監視

      - `.onHover` — ホバーイベント

      - `Task { await ... }` — クロージャ内での非同期呼び出し

      - `.id()` — ビューの一意識別


