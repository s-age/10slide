      ## このファイルで解説すべき概念


      - DI（依存性注入）パターンとは何か — なぜ直接 new しないのか

      - `final class` — コンテナが継承不要である理由

      - `let` プロパティ — 不変な依存関係

      - `init() throws` — 失敗可能なイニシャライザ

      - 依存の初期化順序 — infrastructure → repositories → domain → useCases →
      presentation

      - `Sendable` プロトコル — スレッドセーフな型

      - `any Protocol` 型 — プロトコル存在型でコンテナに格納

      - ファクトリクロージャ — `@MainActor @Sendable (SlideshowResponse) -> ViewModel` の意味


