tasks:
  - type: script
    command: mkdir -p docs/swift-guide/App docs/swift-guide/Presentation
      docs/swift-guide/DI docs/swift-guide/UseCases docs/swift-guide/Domain
      docs/swift-guide/Repositories docs/swift-guide/Infrastructure
    done: true
  - type: agent
    name: swift-guide-app
    task: >
      source: Sources/App/TenSlideApp.swift

      output: docs/swift-guide/App/TenSlideApp.md


      Read the source file. Write a beginner-friendly guide in Japanese
      explaining every Swift concept used in the file.


      対象読者: Swiftを学び始めたばかりの人。コードを読んで「なぜこう書くのか？」が分からない人。


      ## 書き方のルール


      1. ファイルの冒頭にソースファイルのパスと概要を書く

      2. コードを上から順に読みながら、出てくるSwift概念をそれぞれ解説する

      3. 各概念について:
         - その概念が何であるか（定義）
         - なぜここで使われているか（目的）
         - もしこれを使わなかったらどうなるか（対比）
         - 実際のコードの該当部分を引用する
      4. 最後に「このファイルで学べること」をまとめる


      ## このファイルで解説すべき概念


      - `import SwiftUI` / `import SwiftData` — フレームワークのインポート

      - `@main` — アプリのエントリーポイント

      - `struct ... : App` — App プロトコルへの準拠

      - `private let` — アクセス制御と定数

      - `init()` — イニシャライザ

      - `do-catch` / `fatalError` — エラーハンドリング

      - `var body: some Scene` — Scene プロトコルと some キーワード（opaque type）

      - `WindowGroup { }` — ウィンドウの定義

      - `.modelContainer()` — SwiftData のモデルコンテナ修飾子


      Markdownで書くこと。コードブロックは ```swift で囲む。
    model: sonnet
