      ## このファイルで解説すべき概念


      - `import Observation` — Observation フレームワーク

      - `@Observable` — 監視可能なクラス（ObservableObject との違い）

      - `@MainActor` — メインアクター（UIスレッド保証）

      - `final class` — 継承禁止のクラス

      - `private(set)` — 読み取り専用プロパティ（外部からは読み取りのみ）

      - `enum` 内の定義（FullscreenHintType）— ネストされた型

      - `Task { }` / `Task.isCancelled` — 構造化された並行処理

      - `async` / `await` — 非同期処理

      - `Task.sleep(for:)` — 非同期スリープ

      - `Task.detached(priority:)` — デタッチドタスク

      - `guard` 文 — 早期リターン

      - `defer { }` — 遅延実行

      - `try` / `do-catch` — エラーハンドリング

      - `any Protocol` — 存在型（Existential type）

      - タイマーパターン（Task ベースのタイマー）


