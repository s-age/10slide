name: 10slide
packages:
  SwiftLint:
    url: https://github.com/realm/SwiftLint
    from: "0.57.1"
  Yams:
    url: https://github.com/jpsim/Yams
    from: "5.0.0"
options:
  bundleIdPrefix: com.sage0196
  createIntermediateGroups: true
  xcodeVersion: "2650"
  deploymentTarget:
    iOS: "26.0"

targets:
  10slide:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLint
      - package: Yams
        product: Yams
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_MODULE_NAME: TenSlide
        PRODUCT_BUNDLE_IDENTIFIER: com.sage0196.10slide
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  10slideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: 10slide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sage0196.10slideTests
        PRODUCT_MODULE_NAME: TenSlideTests

schemes:
  10slide:
    build:
      targets:
        10slide: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - 10slideTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
