name: 10slide
options:
  bundleIdPrefix: com.sage0196
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

targets:
  10slide:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_MODULE_NAME: TenSlide
        PRODUCT_BUNDLE_IDENTIFIER: com.sage0196.10slide
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  10slideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: 10slide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sage0196.10slideTests
        PRODUCT_MODULE_NAME: TenSlideTests
