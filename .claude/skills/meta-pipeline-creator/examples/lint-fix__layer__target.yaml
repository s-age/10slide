tasks:
  - type: pipeline
    name: lint-fix-layer-target
    tasks:
      - type: agent
        name: implement-lint-fix-layer-target
        task: |
          Fix all <rule-name> violations in:
          - Sources/Layer/Target.swift

          After editing, run `swiftlint lint --config .swiftlint.yml <files>` to verify no violations remain.
        model: haiku
        allowed_tools:
          - Read
          - Edit
          - Bash

      - type: script
        command: xcodebuild -scheme 10slide -destination 'platform=iOS Simulator,name=iPhone 16' build
        rejected:
          to: implement-lint-fix-layer-target
          max_retries: 3

  - type: agent
    name: implement-lint-fix-layer-target
    task: |
      Lint violations fixed and build passing. Commit the changes with an appropriate conventional commit message (e.g. fix(lint): ...).
    model: haiku
    allowed_tools:
      - Read
      - Bash
